    <script>(()=>{const SALT=Uint8Array.from(atob("AWaArAUzkoaM0WEFBueh8g=="),c=>c.charCodeAt(0)),IT=600000;
    const D=Uint8Array.from(atob(document.getElementById("d").textContent.trim()),c=>c.charCodeAt(0));
    /* remplacer la page seulement quand la page du mot de passe est entièrement chargée : sinon (rechargement, clé gardée
       dans sessionStorage) document.write s'ajoute à la page en cours et les deux s'affichent l'une au-dessus de l'autre */
    const ready=()=>document.readyState==="complete"?Promise.resolve():new Promise(r=>addEventListener("load",r,{once:true}));
    async function open_(K){const h=await crypto.subtle.decrypt({name:"AES-GCM",iv:D.slice(0,12)},K,D.slice(12));
    window.__AK=K;window.__AS=SALT;const t=await new Response(new Blob([h]).stream().pipeThrough(new DecompressionStream("gzip"))).text();await ready();setTimeout(()=>{document.open();document.write(t);document.close();},0);}
    async function derive(p){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:IT,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"]);}
    (async()=>{let r=null;try{r=sessionStorage.getItem("ak-paternel")}catch(_){}const f=document.getElementById("f");if(r)f.style.visibility="hidden";
    try{if(r){const K=await crypto.subtle.importKey("raw",Uint8Array.from(atob(r),c=>c.charCodeAt(0)),"AES-GCM",true,["decrypt"]);await open_(K);}}catch(e){f.style.visibility="";try{sessionStorage.removeItem("ak-paternel")}catch(_){}}})();
    document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("m");m.textContent="Vérification…";
    try{const K=await derive(document.getElementById("pw").value);await crypto.subtle.decrypt({name:"AES-GCM",iv:D.slice(0,12)},K,D.slice(12));
    try{const raw=await crypto.subtle.exportKey("raw",K);sessionStorage.setItem("ak-paternel",btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}
    await open_(K);}catch(err){m.textContent="Mot de passe incorrect.";}};})();</script></body></html>
